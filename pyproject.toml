[project]
name = "llm-sql-finetuning"
version = "0.1.0"
description = "Project made for course 'Deep Learning' during semester"
readme = "README.md"
authors = [
    { name = "MrSpokeMan", email = "filip.mirski@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.10.1",
    "datasets>=4.1.1",
    "huggingface-hub[hf-xet]>=0.35.3",
    "pyyaml>=6.0.3",
    "torch>=2.8.0",
    "transformers>=4.57.0",
    "trl>=0.23.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
llm-sql-project = "llm_sql_finetuning:main"

[build-system]
requires = ["uv_build>=0.8.1,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
strict = true

[tool.ruff]
line-length = 135
target-version = "py311"

[[tool.mypy.overrides]]
module = "llm_sql_finetuning.*"
disable_error_code = ["import-untyped", "call-overload"]